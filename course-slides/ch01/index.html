/* === 固定舞臺基礎樣式 === */
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

:root{--stage-bg:#E6E6E6;--slide-bg:#fff;--ink:#222222;--muted:#5F6762;--green:#86BC25;--deep:#046A38;--pale:#F1F6E4}
*{box-sizing:border-box}body{font-family:"Microsoft JhengHei","微軟正黑體",EmbeddedNoto,sans-serif;color:var(--ink)}
/* === 頁首與主標題 === */
.slide{padding:68px 88px 62px}
.chapter{display:flex;align-items:center;gap:18px;font-size:23px;font-weight:700;color:var(--deep);letter-spacing:1px}
.chapter:before{content:"";width:10px;height:26px;background:var(--green)}
h1{font-size:67px;line-height:1.25;letter-spacing:-1.4px;margin:38px 0 20px;font-weight:700}
.subtitle{font-size:32px;line-height:1.5;color:var(--muted);margin:0}
/* === 三階段工作流程 === */
.workflow{display:grid;grid-template-columns:1fr 62px 1fr 62px 1fr;align-items:center;margin-top:64px}
.card{height:478px;padding:35px 37px;border:1.5px solid #DFE4DC;border-radius:22px;background:#F8F9F7;position:relative}
.card.ai{background:var(--pale);border-color:#D8E6BE}
.card-header{display:flex;align-items:center;justify-content:space-between}
.icon{width:64px;height:64px;color:var(--deep)}
.step{color:#687264;font-size:25px;font-weight:500;letter-spacing:2px}
h2{font-size:38px;line-height:1.4;font-weight:700;margin:35px 0 30px;white-space:nowrap;letter-spacing:-.8px}
.ai h2{font-size:36px}
.message{font-size:31px;line-height:1.8;margin:0}
.message strong{font-weight:700}
.actions{padding:0;margin:0;list-style:none;font-size:32px;line-height:1.6}
.actions li{margin-bottom:19px;display:flex;align-items:center;gap:17px;white-space:nowrap}
.actions li:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.arrow{width:34px;height:34px;justify-self:center;color:#89977B}
/* === 核心訊息 === */
.takeaway{margin-top:56px;border-top:1.5px solid #DFE4DC;padding-top:37px;text-align:center;font-size:34px;line-height:1.65;letter-spacing:.1px}
.takeaway strong{color:var(--deep);font-weight:700}
/* === 編輯工具：投影時自動隱藏 === */
.edit-hotzone{position:fixed;top:0;left:0;width:65px;height:65px;z-index:20}
.edit-toggle{position:fixed;top:12px;left:12px;z-index:21;border:1px solid #CAD2C2;border-radius:7px;background:#fff;color:#222;padding:9px 13px;font:14px sans-serif;opacity:0;pointer-events:none;transition:opacity .2s}
.edit-toggle.show,.edit-toggle.active{opacity:1;pointer-events:auto}
[contenteditable=true]{outline:2px dashed var(--green);outline-offset:5px}
@media print{.edit-hotzone,.edit-toggle{display:none!important}@page{size:16in 9in;margin:0}}
</style>

<div class="takeaway" data-edit>AI 協助整理資訊與產生草稿，<strong>最終判斷仍由公務員負責。</strong></div>
</section></main></div>
<div class="edit-hotzone" aria-hidden="true"></div><button class="edit-toggle" id="editToggle" title="按 E 編輯文字，Ctrl／⌘+S 儲存 HTML">編輯文字</button>
<script>
/* === 單頁簡報控制與等比例縮放 === */
class SlidePresentation{
constructor(){this.stage=document.getElementById('deckStage');this.slides=[...document.querySelectorAll('.slide')];this.currentSlide=0;this.resize=()=>{let k=Math.min(innerWidth/1920,innerHeight/1080);this.stage.style.transform='translate('+((innerWidth-1920*k)/2)+'px,'+((innerHeight-1080*k)/2)+'px) scale('+k+')'};this.resize();addEventListener('resize',this.resize);this.showSlide(0);addEventListener('keydown',e=>{if(e.target.isContentEditable)return;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();this.showSlide(this.currentSlide+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();this.showSlide(this.currentSlide-1)}});let start=0;addEventListener('touchstart',e=>{start=e.changedTouches[0].clientX},{passive:true});addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>60)this.showSlide(this.currentSlide+(dx<0?1:-1))},{passive:true});addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>40)this.showSlide(this.currentSlide+(e.deltaY>0?1:-1))},{passive:true})}
showSlide(i){this.currentSlide=Math.max(0,Math.min(i,this.slides.length-1));this.slides.forEach((s,j)=>{s.classList.toggle('active',j===this.currentSlide);s.classList.toggle('visible',j===this.currentSlide)})}}
new SlidePresentation();
/* === 文字編輯、瀏覽器暫存與單檔下載 === */
const editable=[...document.querySelectorAll('[data-edit]')],button=document.getElementById('editToggle'),zone=document.querySelector('.edit-hotzone');let editing=false,timer;const key='CH01-Deloitte-20261015-v2';
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(saved)&&saved.length===editable.length)editable.forEach((e,i)=>e.innerHTML=saved[i])}catch{}
function toggle(){editing=!editing;editable.forEach(e=>e.contentEditable=String(editing));button.classList.toggle('active',editing);button.textContent=editing?'完成編輯':'編輯文字'}
function persist(){try{localStorage.setItem(key,JSON.stringify(editable.map(e=>e.innerHTML)))}catch{}}
editable.forEach(e=>e.addEventListener('input',persist));button.onclick=toggle;zone.onclick=toggle;
for(const el of [zone,button]){el.onmouseenter=()=>{clearTimeout(timer);button.classList.add('show')};el.onmouseleave=()=>{timer=setTimeout(()=>{if(!editing)button.classList.remove('show')},400)}}
function save(){persist();const clone=document.documentElement.cloneNode(true);clone.querySelectorAll('[data-edit]').forEach(e=>e.removeAttribute('contenteditable'));clone.querySelector('.edit-toggle').classList.remove('active','show');clone.querySelector('.edit-toggle').textContent='編輯文字';const blob=new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CH01_Deloitte_情境導入.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save()}else if(e.key.toLowerCase()==='e'&&!e.target.isContentEditable)toggle();else if(e.key==='Escape'&&editing)toggle()});
</script></body></html>
